# Blank issues are disabled: a form takes thirty seconds and saves ten minutes
# of follow-up questions.
blank_issues_enabled: false

contact_links:
  - name: Security vulnerability
    url: https://github.com/Qinux-Os/community/security/advisories/new
    about: Report privately. Never open a public issue for a security bug.
  - name: Question or discussion
    url: https://github.com/orgs/Qinux-Os/discussions
    about: Ask how to do something, or start a wider conversation.
  - name: Proposal needing an RFC
    url: https://github.com/Qinux-Os/rfcs
    about: Architectural changes start as an RFC, not a pull request.
  - name: Contributing guide
    url: https://github.com/Qinux-Os/community/blob/main/guidelines/CONTRIBUTING.md
    about: How to submit a change, commit style, and the review process.
